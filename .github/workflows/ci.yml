name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pins the Xcode version so CI is reproducible across runner updates
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show build environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep "iPhone 1" | tail -5

      # DerivedData cache — keyed on project.pbxproj so it resets on structure changes
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      # Build the main app target to verify it compiles cleanly
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project InvestPortfolio.xcodeproj \
            -scheme InvestPortfolio \
            -destination "platform=iOS Simulator,OS=latest,name=iPhone 16" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      # Run unit/integration tests and collect a result bundle for artifact upload
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project InvestPortfolio.xcodeproj \
            -scheme InvestPortfolio \
            -destination "platform=iOS Simulator,OS=latest,name=iPhone 16" \
            -only-testing:InvestPortfolioTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Always upload the result bundle so failures can be investigated locally
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults.xcresult
